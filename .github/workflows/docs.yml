name: docs

# rulec's documentation moved to ritsu's site (https://i2y.github.io/ritsu/rulec/), with rulec
# itself, which is now one of ritsu's languages (https://github.com/i2y/ritsu). This publishes only
# moved/: one page, as index.html and 404.html, that sends every address of this site to the same
# page under ritsu's, query and #… kept (the playground's page there sends a reader on to ritsu's
# playground, which opens the links the old one shared). website/ stays as it was, and is no longer
# published.

on:
  push:
    branches: [main]
    paths:
      - "moved/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the pages are there
        run: |
          test -f moved/index.html
          test -f moved/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: moved

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
