<title>rulec has moved to ritsu's site</title>
<script>
  // Every page of this site is now under ritsu's: /rulec/<page> is /ritsu/rulec/<page>, with its
  // query and its #… kept. The playground's page there sends a reader on to ritsu's playground,
  // which opens the links the old one shared.
  location.replace("https://i2y.github.io/ritsu/rulec" + location.pathname.replace(/^\/rulec(\/|$)/, "/") + location.search + location.hash);
</script>
<p>rulec's documentation is now part of ritsu's site: <a href="https://i2y.github.io/ritsu/rulec/">https://i2y.github.io/ritsu/rulec/</a>.
rulec itself is now one of ritsu's languages: <a href="https://github.com/i2y/ritsu">github.com/i2y/ritsu</a>.</p>
<p lang="ja">rulec のドキュメントは、ritsu のサイトに移りました：<a href="https://i2y.github.io/ritsu/rulec/ja/">https://i2y.github.io/ritsu/rulec/ja/</a>。rulec は、ritsu の言語の一つになりました。</p>
